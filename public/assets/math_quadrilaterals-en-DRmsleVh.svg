<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 930" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Quadrilaterals: Six Core Concepts</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Four-sided geometric figures.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Square</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Four equal sides and four</tspan><tspan x="15" dy="16">right angles.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">P = 4a,    S = a²</text>
    <path d="M115,170 L265,170 L265,320 L115,320 Z" fill="#1e40af" fill-opacity="0.28" stroke="#1e40af" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="190" y1="165.5" x2="190" y2="174.5" stroke="#1e40af" stroke-width="2"/>
    <line x1="269.5" y1="245" x2="260.5" y2="245" stroke="#1e40af" stroke-width="2"/>
    <line x1="190" y1="324.5" x2="190" y2="315.5" stroke="#1e40af" stroke-width="2"/>
    <line x1="110.5" y1="245" x2="119.5" y2="245" stroke="#1e40af" stroke-width="2"/>
    <path d="M126,170 L126,181 L115,181" fill="none" stroke="#1e40af" stroke-width="2"/>
    <path d="M254,320 L254,309 L265,309" fill="none" stroke="#1e40af" stroke-width="2"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">A square is also a rhombus</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Rectangle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Opposite sides equal and</tspan><tspan x="15" dy="16">four right angles.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">P = 2(a + b),    S = a × b</text>
    <path d="M90,185 L290,185 L290,305 L90,305 Z" fill="#991b1b" fill-opacity="0.28" stroke="#991b1b" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="190" y1="180.5" x2="190" y2="189.5" stroke="#991b1b" stroke-width="2"/>
    <line x1="190" y1="309.5" x2="190" y2="300.5" stroke="#991b1b" stroke-width="2"/>
    <line x1="294.5" y1="241.5" x2="285.5" y2="241.5" stroke="#991b1b" stroke-width="2"/><line x1="294.5" y1="248.5" x2="285.5" y2="248.5" stroke="#991b1b" stroke-width="2"/>
    <line x1="85.5" y1="248.5" x2="94.5" y2="248.5" stroke="#991b1b" stroke-width="2"/><line x1="85.5" y1="241.5" x2="94.5" y2="241.5" stroke="#991b1b" stroke-width="2"/>
    <path d="M101,185 L101,196 L90,196" fill="none" stroke="#991b1b" stroke-width="2"/>
    <path d="M279,305 L279,294 L290,294" fill="none" stroke="#991b1b" stroke-width="2"/>
    <text x="190" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">a</text>
    <text x="305" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">b</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">Its diagonals are equal</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Parallelogram</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Opposite sides are parallel</tspan><tspan x="15" dy="16">and equal in length.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">S = a × h</text>
    <path d="M70,305 L150,180 L315,180 L235,305 Z" fill="#166534" fill-opacity="0.28" stroke="#166534" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="150" y1="180" x2="150" y2="305" stroke="#166534" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M160,305 L160,295 L150,295" fill="none" stroke="#166534" stroke-width="2"/>
    <text x="163" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">h</text>
    <text x="152" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">a</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">The diagonals cut each other in half</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Rhombus</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A parallelogram with four</tspan><tspan x="15" dy="16">equal sides.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">S = (d1 × d2) ÷ 2</text>
    <path d="M190,165 L290,243 L190,321 L90,243 Z" fill="#854d0e" fill-opacity="0.28" stroke="#854d0e" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="90" y1="243" x2="290" y2="243" stroke="#854d0e" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="190" y1="165" x2="190" y2="321" stroke="#854d0e" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="242.768" y1="200.452" x2="237.232" y2="207.548" stroke="#854d0e" stroke-width="2"/>
    <line x1="242.768" y1="285.548" x2="237.232" y2="278.452" stroke="#854d0e" stroke-width="2"/>
    <line x1="137.232" y1="285.548" x2="142.768" y2="278.452" stroke="#854d0e" stroke-width="2"/>
    <line x1="137.232" y1="200.452" x2="142.768" y2="207.548" stroke="#854d0e" stroke-width="2"/>
    <text x="245" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">d1</text>
    <text x="205" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">d2</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">Its diagonals are perpendicular</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Trapezoid</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Exactly one pair of parallel</tspan><tspan x="15" dy="16">sides, called the bases.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#86198f">S = ((a + b) ÷ 2) × h</text>
    <path d="M65,305 L315,305 L255,185 L125,185 Z" fill="#86198f" fill-opacity="0.28" stroke="#86198f" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="125" y1="185" x2="125" y2="305" stroke="#86198f" stroke-width="1.8" stroke-dasharray="6 4"/>
    <path d="M135,305 L135,295 L125,295" fill="none" stroke="#86198f" stroke-width="2"/>
    <text x="190" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#86198f">b</text>
    <text x="190" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#86198f">a</text>
    <text x="139" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#86198f">h</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">The height joins the two bases</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Kite</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Two pairs of equal sides that</tspan><tspan x="15" dy="16">sit next to each other.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">S = (d1 × d2) ÷ 2</text>
    <path d="M190,158 L272,228 L190,330 L108,228 Z" fill="#c2410c" fill-opacity="0.28" stroke="#c2410c" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="233.922" y1="189.577" x2="228.078" y2="196.423" stroke="#c2410c" stroke-width="2"/>
    <line x1="146.078" y1="189.577" x2="151.922" y2="196.423" stroke="#c2410c" stroke-width="2"/>
    <line x1="236.7" y1="279.092" x2="229.686" y2="273.453" stroke="#c2410c" stroke-width="2"/><line x1="232.314" y1="284.547" x2="225.3" y2="278.908" stroke="#c2410c" stroke-width="2"/>
    <line x1="147.686" y1="284.547" x2="154.7" y2="278.908" stroke="#c2410c" stroke-width="2"/><line x1="143.3" y1="279.092" x2="150.314" y2="273.453" stroke="#c2410c" stroke-width="2"/>
    <line x1="108" y1="228" x2="272" y2="228" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4"/>
    <line x1="190" y1="158" x2="190" y2="330" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">One diagonal is an axis of symmetry</text>
  </g>
</svg>
