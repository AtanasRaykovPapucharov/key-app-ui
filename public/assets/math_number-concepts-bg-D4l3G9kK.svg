<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1730" font-family="Arial, Helvetica, sans-serif">
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Дванадесет основни понятия за числата</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">От естествени числа до научен запис</text>
  <g fill="#1e293b">
    <g transform="translate(20 130)"><rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Естествени числа</text><text x="20" y="76" font-size="14">Числа за броене: 1, 2, 3, 4, ...</text><text x="190" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">N = { 1, 2, 3, 4, 5, ... }</text><line x1="35" y1="265" x2="345" y2="265" stroke="#1e293b" stroke-width="2"/><text x="190" y="325" text-anchor="middle" font-size="14" fill="#1e40af">Продължават безкрайно</text></g>
    <g transform="translate(420 130)"><rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Цели числа</text><text x="20" y="76" font-size="14">Отрицателни, нула и положителни.</text><text x="190" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">Z = { ..., -2, -1, 0, 1, 2, ... }</text><line x1="35" y1="265" x2="345" y2="265" stroke="#1e293b" stroke-width="2"/><text x="190" y="325" text-anchor="middle" font-size="14" fill="#991b1b">Без дроби и десетични дроби</text></g>
    <g transform="translate(820 130)"><rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Рационални числа</text><text x="20" y="76" font-size="14">Числа от вида p/q, където q не е 0.</text><text x="190" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Q = { p/q : p, q в Z, q != 0 }</text><text x="190" y="245" text-anchor="middle" font-size="26" font-weight="bold" fill="#166534">1/2 = 0,5</text><text x="190" y="325" text-anchor="middle" font-size="14" fill="#166534">Включват цели и периодични дроби</text></g>
    <g transform="translate(20 530)"><rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Реални числа</text><text x="20" y="76" font-size="14">Рационални и ирационални числа.</text><text x="190" y="135" text-anchor="middle" font-size="20" font-weight="bold" fill="#854d0e">R = Q обединение ирационални</text><line x1="35" y1="265" x2="345" y2="265" stroke="#1e293b" stroke-width="2"/><text x="190" y="325" text-anchor="middle" font-size="14" fill="#854d0e">Например корен от 2 и pi</text></g>
    <g transform="translate(420 530)"><rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Дроби</text><text x="20" y="76" font-size="14">Част от цялото: числител / знаменател.</text><circle cx="190" cy="220" r="75" fill="none" stroke="#92400e" stroke-width="3"/><path d="M190 220 L190 145 A75 75 0 0 1 265 220 Z M190 220 L265 220 A75 75 0 0 1 190 295 Z M190 220 L190 295 A75 75 0 0 1 115 220 Z" fill="#f59e0b"/><text x="190" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#92400e">3/4</text></g>
    <g transform="translate(820 530)"><rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Десетични дроби</text><text x="20" y="76" font-size="14">Разряд след десетичната запетая.</text><text x="190" y="210" text-anchor="middle" font-size="36" font-weight="bold" fill="#c2410c">0,75</text><text x="190" y="255" text-anchor="middle" font-size="22" fill="#c2410c">= 75/100</text><text x="190" y="325" text-anchor="middle" font-size="14">Десети, стотни, хилядни</text></g>
    <g transform="translate(20 930)"><rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Проценти</text><text x="20" y="76" font-size="14">Дроб с основа 100.</text><text x="190" y="175" text-anchor="middle" font-size="34" font-weight="bold" fill="#047857">75%</text><rect x="40" y="205" width="300" height="34" rx="6" fill="white" stroke="#475569" stroke-width="2"/><rect x="40" y="205" width="225" height="34" rx="6" fill="#10b981"/><text x="190" y="310" text-anchor="middle" font-size="14" fill="#047857">75 от 100 = 75%</text></g>
    <g transform="translate(420 930)"><rect width="380" height="380" rx="16" fill="#e0e7ff" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Абсолютна стойност</text><text x="20" y="76" font-size="14">Разстояние от нулата по числовата ос.</text><line x1="35" y1="220" x2="345" y2="220" stroke="#1e293b" stroke-width="2"/><circle cx="80" cy="220" r="7" fill="#dc2626"/><circle cx="190" cy="220" r="7" fill="#6b7280"/><circle cx="300" cy="220" r="7" fill="#2563eb"/><text x="190" y="325" text-anchor="middle" font-size="24" font-weight="bold" fill="#312e81">|-3| = 3</text></g>
    <g transform="translate(820 930)"><rect width="380" height="380" rx="16" fill="#fce7f3" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Ред на действията</text><text x="30" y="105" font-size="16" fill="#7f1d1d">Скоби</text><text x="30" y="145" font-size="16" fill="#7c2d12">Степени</text><text x="30" y="185" font-size="16" fill="#713f12">Умножение и деление</text><text x="30" y="225" font-size="16" fill="#14532d">Събиране и изваждане</text><text x="190" y="325" text-anchor="middle" font-size="20" font-weight="bold">3 + 4 x 2 = 11</text></g>
    <g transform="translate(20 1330)"><rect width="380" height="380" rx="16" fill="#cffafe" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Степени</text><text x="20" y="76" font-size="14">Повторно умножение: основа на степен.</text><text x="190" y="190" text-anchor="middle" font-size="42" font-weight="bold" fill="#0e7490">2 на трета</text><text x="190" y="245" text-anchor="middle" font-size="24" fill="#0e7490">2 x 2 x 2 = 8</text></g>
    <g transform="translate(420 1330)"><rect width="380" height="380" rx="16" fill="#ede9fe" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Корени</text><text x="20" y="76" font-size="14">Обратното действие на степенуването.</text><text x="190" y="200" text-anchor="middle" font-size="42" font-weight="bold" fill="#5b21b6">корен от 9 = 3</text><text x="190" y="255" text-anchor="middle" font-size="18" fill="#5b21b6">защото 3 x 3 = 9</text></g>
    <g transform="translate(820 1330)"><rect width="380" height="380" rx="16" fill="#fef3c7" stroke="#475569" stroke-width="2"/><text x="190" y="34" text-anchor="middle" font-size="19" font-weight="bold">Научен запис</text><text x="20" y="76" font-size="14">Големи и малки числа чрез степени на 10.</text><text x="190" y="180" text-anchor="middle" font-size="24" font-weight="bold" fill="#78350f">320 000</text><text x="190" y="245" text-anchor="middle" font-size="28" font-weight="bold" fill="#78350f">3,2 x 10 на пета</text><text x="190" y="325" text-anchor="middle" font-size="18" fill="#78350f">0,00047 = 4,7 x 10 на -4</text></g>
  </g>
</svg>