<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Problem Solving: Eight Core Concepts</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Methods for solving mathematical problems.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Word Problems</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Text first, mathematics second:</tspan><tspan x="15" dy="16">turn the words into an equation.</tspan></text>
    <rect x="35" y="180" width="130" height="90" rx="8" fill="#ffffff" fill-opacity="0.8" stroke="#1e40af" stroke-width="1.8"/>
    <rect x="50" y="198" width="100" height="7" rx="3" fill="#1e40af" fill-opacity="0.45"/><rect x="50" y="216" width="88" height="7" rx="3" fill="#1e40af" fill-opacity="0.45"/><rect x="50" y="234" width="100" height="7" rx="3" fill="#1e40af" fill-opacity="0.45"/><rect x="50" y="252" width="62" height="7" rx="3" fill="#1e40af" fill-opacity="0.45"/>
    <line x1="178" y1="225" x2="209" y2="225" stroke="#1e40af" stroke-width="2.4"/><path d="M216,225 L209,221.15 L209,228.85 Z" fill="#1e40af"/>
    <rect x="228" y="192" width="112" height="66" rx="8" fill="#1e40af" fill-opacity="0.25" stroke="#1e40af" stroke-width="1.8"/>
    <text x="284" y="233" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">2x = 10</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">Read it twice before you write anything</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Step by Step</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Break the task into small steps</tspan><tspan x="15" dy="16">and do them in order.</tspan></text>
    <rect x="42" y="215" width="58" height="52" rx="8" fill="#ffffff" fill-opacity="0.8" stroke="#991b1b" stroke-width="2"/>
    <text x="71" y="247" text-anchor="middle" font-size="22" font-weight="bold" fill="#991b1b">1</text>
    <path d="M100,215 Q130.5,181 156,215" stroke="#991b1b" stroke-width="1.8" fill="none"/>
    <line x1="145" y1="203" x2="152.252" y2="210.856" stroke="#991b1b" stroke-width="1.8"/><path d="M157,216 L155.081,208.245 L149.423,213.468 Z" fill="#991b1b"/>
    <text x="130.5" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">→</text>
    <rect x="161" y="215" width="58" height="52" rx="8" fill="#ffffff" fill-opacity="0.8" stroke="#991b1b" stroke-width="2"/>
    <text x="190" y="247" text-anchor="middle" font-size="22" font-weight="bold" fill="#991b1b">2</text>
    <path d="M219,215 Q249.5,181 275,215" stroke="#991b1b" stroke-width="1.8" fill="none"/>
    <line x1="264" y1="203" x2="271.252" y2="210.856" stroke="#991b1b" stroke-width="1.8"/><path d="M276,216 L274.081,208.245 L268.423,213.468 Z" fill="#991b1b"/>
    <text x="249.5" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">→</text>
    <rect x="280" y="215" width="58" height="52" rx="8" fill="#ffffff" fill-opacity="0.8" stroke="#991b1b" stroke-width="2"/>
    <text x="309" y="247" text-anchor="middle" font-size="22" font-weight="bold" fill="#991b1b">3</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">Small steps are easier to check</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Known Values</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The numbers the problem gives</tspan><tspan x="15" dy="16">you right at the start.</tspan></text>
    <rect x="55" y="200" width="120" height="58" rx="8" fill="#166534" fill-opacity="0.18" stroke="#166534" stroke-width="1.8"/>
    <text x="115" y="236" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">a = 5</text>
    <rect x="185" y="200" width="120" height="58" rx="8" fill="#166534" fill-opacity="0.18" stroke="#166534" stroke-width="1.8"/>
    <text x="245" y="236" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">b = 3</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">Write them down before you start</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Unknown Value</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">What the problem asks for.</tspan><tspan x="15" dy="16">Give it a letter, usually x.</tspan></text>
    <rect x="115" y="185" width="150" height="90" rx="12" fill="#854d0e" fill-opacity="0.25" stroke="#854d0e" stroke-width="2.2" stroke-dasharray="8 5"/>
    <text x="190" y="250" text-anchor="middle" font-size="34" font-weight="bold" fill="#854d0e">x = ?</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">Naming it is half of the solution</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Formula</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The rule that links the known</tspan><tspan x="15" dy="16">and unknown values.</tspan></text>
    <rect x="55" y="194" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#86198f" stroke-width="1.5"/>
    <text x="190" y="216.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">S = a × b</text>
    <rect x="55" y="238" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#86198f" stroke-width="1.5"/>
    <text x="190" y="260.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">S = 5 × 3</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">Substitute the numbers into the letters</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Solution</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The written work that leads</tspan><tspan x="15" dy="16">from the data to the result.</tspan></text>
    <rect x="55" y="194" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="216.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">S = 5 × 3</text>
    <rect x="55" y="238" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="260.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">S = 15</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">Show the work, not only the number</text>
  </g>
  <g transform="translate(20,930)">
    <rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Answer</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The final result, written with</tspan><tspan x="15" dy="16">its unit of measurement.</tspan></text>
    <rect x="105" y="195" width="170" height="80" rx="12" fill="#047857" fill-opacity="0.3" stroke="#047857" stroke-width="2.2"/>
    <text x="190" y="252" text-anchor="middle" font-size="30" font-weight="bold" fill="#047857">15 cm²</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#047857">A number without a unit is incomplete</text>
  </g>
  <g transform="translate(420,930)">
    <rect width="380" height="380" rx="16" fill="#e0e7ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Check</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Put the result back and see</tspan><tspan x="15" dy="16">whether everything fits.</tspan></text>
    <rect x="55" y="175" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#312e81" stroke-width="1.5"/>
    <text x="190" y="197.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#312e81">15 ÷ 3 = 5</text>
    <rect x="55" y="219" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#312e81" stroke-width="1.5"/>
    <text x="190" y="241.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#312e81">15 ÷ 5 = 3</text>
    <path d="M175,285 l9.8,11.2 l21,-26.6" fill="none" stroke="#15803d" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#312e81">A check catches most careless mistakes</text>
  </g>
</svg>
