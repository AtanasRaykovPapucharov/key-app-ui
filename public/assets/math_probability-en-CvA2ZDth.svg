<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 930" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Probability: Six Core Concepts</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Measuring the likelihood of events.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Probability</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A number from 0 to 1 giving</tspan><tspan x="15" dy="16">the chance of an event.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">P(A) = favourable / all outcomes</text>
    <rect x="55" y="215" width="270" height="34" rx="6" fill="#ffffff" fill-opacity="0.7" stroke="#1e40af" stroke-width="2"/>
    <rect x="55" y="215" width="135" height="34" rx="6" fill="#1e40af" fill-opacity="0.55"/>
    <text x="55" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">0</text>
    <text x="190" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">0.5</text>
    <text x="325" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">1</text>
    
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">0 means impossible, 1 means certain</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Outcome</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">One possible result of a</tspan><tspan x="15" dy="16">single experiment.</tspan></text>
    <rect x="35" y="205" width="42" height="46" rx="8" fill="#991b1b" fill-opacity="0.18" stroke="#991b1b" stroke-width="1.8"/>
    <text x="56" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">1</text>
    <rect x="88.6" y="205" width="42" height="46" rx="8" fill="#991b1b" fill-opacity="0.18" stroke="#991b1b" stroke-width="1.8"/>
    <text x="109.6" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">2</text>
    <rect x="142.2" y="205" width="42" height="46" rx="8" fill="#991b1b" fill-opacity="0.18" stroke="#991b1b" stroke-width="1.8"/>
    <text x="163.2" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">3</text>
    <rect x="195.8" y="205" width="42" height="46" rx="8" fill="#991b1b" fill-opacity="0.18" stroke="#991b1b" stroke-width="1.8"/>
    <text x="216.8" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">4</text>
    <rect x="249.4" y="205" width="42" height="46" rx="8" fill="#991b1b" fill-opacity="0.18" stroke="#991b1b" stroke-width="1.8"/>
    <text x="270.4" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">5</text>
    <rect x="303" y="205" width="42" height="46" rx="8" fill="#991b1b" fill-opacity="0.18" stroke="#991b1b" stroke-width="1.8"/>
    <text x="324" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">6</text>
    <text x="190" y="300" text-anchor="middle" font-size="22" font-weight="bold" fill="#991b1b">6</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">A die has six equally likely outcomes</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Event</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A set of outcomes we are</tspan><tspan x="15" dy="16">interested in.</tspan></text>
    <rect x="35" y="205" width="42" height="46" rx="8" fill="#166534" fill-opacity="0.18" stroke="#166534" stroke-width="1.8"/>
    <text x="56" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">1</text>
    <rect x="88.6" y="205" width="42" height="46" rx="8" fill="#166534" fill-opacity="0.75" stroke="#166534" stroke-width="1.8"/>
    <text x="109.6" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">2</text>
    <rect x="142.2" y="205" width="42" height="46" rx="8" fill="#166534" fill-opacity="0.18" stroke="#166534" stroke-width="1.8"/>
    <text x="163.2" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">3</text>
    <rect x="195.8" y="205" width="42" height="46" rx="8" fill="#166534" fill-opacity="0.75" stroke="#166534" stroke-width="1.8"/>
    <text x="216.8" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">4</text>
    <rect x="249.4" y="205" width="42" height="46" rx="8" fill="#166534" fill-opacity="0.18" stroke="#166534" stroke-width="1.8"/>
    <text x="270.4" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">5</text>
    <rect x="303" y="205" width="42" height="46" rx="8" fill="#166534" fill-opacity="0.75" stroke="#166534" stroke-width="1.8"/>
    <text x="324" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">6</text>
    <text x="190" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">P = 3 / 6 = 0.5</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">Here the event is: an even number</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Sample Space</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">All outcomes that an</tspan><tspan x="15" dy="16">experiment can produce.</tspan></text>
    <rect x="105" y="180" width="52" height="46" rx="8" fill="#854d0e" fill-opacity="0.18" stroke="#854d0e" stroke-width="1.8"/>
    <text x="131" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">1</text>
    <rect x="164" y="180" width="52" height="46" rx="8" fill="#854d0e" fill-opacity="0.18" stroke="#854d0e" stroke-width="1.8"/>
    <text x="190" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">2</text>
    <rect x="223" y="180" width="52" height="46" rx="8" fill="#854d0e" fill-opacity="0.18" stroke="#854d0e" stroke-width="1.8"/>
    <text x="249" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">3</text>
    <rect x="105" y="240" width="52" height="46" rx="8" fill="#854d0e" fill-opacity="0.18" stroke="#854d0e" stroke-width="1.8"/>
    <text x="131" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">4</text>
    <rect x="164" y="240" width="52" height="46" rx="8" fill="#854d0e" fill-opacity="0.18" stroke="#854d0e" stroke-width="1.8"/>
    <text x="190" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">5</text>
    <rect x="223" y="240" width="52" height="46" rx="8" fill="#854d0e" fill-opacity="0.18" stroke="#854d0e" stroke-width="1.8"/>
    <text x="249" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">6</text>
    <rect x="85" y="162" width="210" height="142" rx="14" fill="none" stroke="#854d0e" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">Their probabilities add up to 1</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Independent Events</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">One event does not change</tspan><tspan x="15" dy="16">the chance of the other.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#86198f">P(A and B) = P(A) × P(B)</text>
    <rect x="70" y="200" width="64" height="60" rx="8" fill="#86198f" fill-opacity="0.18" stroke="#86198f" stroke-width="1.8"/>
    <text x="102" y="237" text-anchor="middle" font-size="22" font-weight="bold" fill="#86198f">H</text>
    <text x="190" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#86198f">×</text>
    <rect x="246" y="200" width="64" height="60" rx="8" fill="#86198f" fill-opacity="0.18" stroke="#86198f" stroke-width="1.8"/>
    <text x="278" y="237" text-anchor="middle" font-size="22" font-weight="bold" fill="#86198f">6</text>
    <text x="190" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#86198f">0.5 × (1/6) = 1/12</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">A coin does not remember the die</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Conditional Probability</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The chance of A once we know</tspan><tspan x="15" dy="16">that B has happened.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">P(A|B) = P(A and B) / P(B)</text>
    <circle cx="155" cy="235" r="68" fill="#c2410c" fill-opacity="0.25" stroke="#c2410c" stroke-width="2"/>
    <circle cx="235" cy="235" r="68" fill="#c2410c" fill-opacity="0.25" stroke="#c2410c" stroke-width="2"/>
    <text x="110" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#c2410c">A</text>
    <text x="280" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#c2410c">B</text>
    
    <text x="195" y="240" text-anchor="middle" font-size="12" fill="#c2410c"></text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">The overlap is where both happen</text>
  </g>
</svg>
