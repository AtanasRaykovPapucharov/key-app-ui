<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Circle: Nine Core Concepts</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Properties and measurements of circles.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Radius</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A segment from the centre to</tspan><tspan x="15" dy="16">any point on the circle.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">r = d ÷ 2</text>
    <circle cx="190" cy="240" r="75" fill="#1e40af" fill-opacity="0.2" stroke="#1e40af" stroke-width="2.2"/>
    <circle cx="190" cy="240" r="5" fill="#1e40af"/>
    <path d="M190,240 L265,240" stroke="#1e40af" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <circle cx="265" cy="240" r="5" fill="#1e40af"/>
    <text x="228" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">r</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">All radii of one circle are equal</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Diameter</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A segment through the centre</tspan><tspan x="15" dy="16">with both ends on the circle.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">d = 2r</text>
    <circle cx="190" cy="240" r="75" fill="#991b1b" fill-opacity="0.2" stroke="#991b1b" stroke-width="2.2"/>
    <circle cx="190" cy="240" r="5" fill="#991b1b"/>
    <path d="M115,240 L265,240" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <circle cx="265" cy="240" r="5" fill="#991b1b"/>
    <circle cx="115" cy="240" r="5" fill="#991b1b"/>
    <text x="190" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">d</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">The longest chord of the circle</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Circumference</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The distance once around</tspan><tspan x="15" dy="16">the circle.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">C = 2πr = πd</text>
    <circle cx="190" cy="225" r="62" fill="#166534" fill-opacity="0.12" stroke="#166534" stroke-width="5"/>
    <path d="M128,225 L252,225" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <text x="190" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">d</text>
    <path d="M65,312 L315,312" stroke="#166534" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <line x1="65" y1="304" x2="65" y2="320" stroke="#166534" stroke-width="2"/>
    <line x1="315" y1="304" x2="315" y2="320" stroke="#166534" stroke-width="2"/>
    <text x="190" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">C</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">About 3.14 diameters long</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Area</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The surface enclosed inside</tspan><tspan x="15" dy="16">the circle.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">S = πr²</text>
    <circle cx="190" cy="240" r="75" fill="#854d0e" fill-opacity="0.45" stroke="#854d0e" stroke-width="2.2"/>
    <circle cx="190" cy="240" r="5" fill="#854d0e"/>
    <path d="M190,240 L227.5,175.048" stroke="#854d0e" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="228" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">r</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">r = 3 gives S = 9π ≈ 28.3</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Arc</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A connected part of the circle</tspan><tspan x="15" dy="16">between two of its points.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#86198f">l = (a ÷ 360) × C</text>
    <circle cx="190" cy="240" r="75" fill="#86198f" fill-opacity="0.12" stroke="#86198f" stroke-width="2.2"/>
    <path d="M254.952,202.5 A75,75 0 0 0 132.547,191.791" fill="none" stroke="#86198f" stroke-width="5"/>
    <path d="M190,240 L254.952,202.5" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <path d="M190,240 L132.547,191.791" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <circle cx="254.952" cy="202.5" r="5" fill="#86198f"/>
    <circle cx="132.547" cy="191.791" r="5" fill="#86198f"/>
    <path d="M167.019,220.716 A30,30 0 0 1 215.981,225" fill="none" stroke="#86198f" stroke-width="2"/><text x="193.922" y="199.171" text-anchor="middle" font-size="13" font-weight="bold" fill="#86198f">a</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">Its length grows with the angle a</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Chord</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A segment joining two points</tspan><tspan x="15" dy="16">of the circle.</tspan></text>
    <circle cx="190" cy="240" r="75" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="2.2"/>
    <path d="M119.523,265.652 L260.477,265.652" stroke="#c2410c" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <circle cx="119.523" cy="265.652" r="5" fill="#c2410c"/>
    <circle cx="260.477" cy="265.652" r="5" fill="#c2410c"/>
    <circle cx="190" cy="240" r="4" fill="#64748b"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">A chord through the centre is a diameter</text>
  </g>
  <g transform="translate(20,930)">
    <rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Central Angle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">An angle with its vertex at</tspan><tspan x="15" dy="16">the centre of the circle.</tspan></text>
    <circle cx="190" cy="240" r="75" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="2.2"/>
    <path d="M247.453,191.791 A75,75 0 0 0 132.547,191.791" fill="none" stroke="#047857" stroke-width="5"/>
    <path d="M190,240 L247.453,191.791" stroke="#047857" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <path d="M190,240 L132.547,191.791" stroke="#047857" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <circle cx="190" cy="240" r="5" fill="#047857"/>
    <path d="M165.487,219.431 A32,32 0 0 1 214.513,219.431" fill="none" stroke="#047857" stroke-width="2"/><text x="190" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">a</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#047857">It has the same measure as its arc</text>
  </g>
  <g transform="translate(420,930)">
    <rect width="380" height="380" rx="16" fill="#e0e7ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Inscribed Angle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">An angle with its vertex on</tspan><tspan x="15" dy="16">the circle itself.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#312e81">inscribed = half the central angle</text>
    <circle cx="190" cy="240" r="75" fill="#312e81" fill-opacity="0.12" stroke="#312e81" stroke-width="2.2"/>
    <path d="M247.453,191.791 A75,75 0 0 0 132.547,191.791" fill="none" stroke="#312e81" stroke-width="4"/>
    <path d="M164.348,310.477 L247.453,191.791" stroke="#312e81" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <path d="M164.348,310.477 L132.547,191.791" stroke="#312e81" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <path d="M190,240 L247.453,191.791" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <path d="M190,240 L132.547,191.791" stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <circle cx="190" cy="240" r="4" fill="#64748b"/>
    <circle cx="164.348" cy="310.477" r="5" fill="#312e81"/>
    <path d="M155.549,277.635 A34,34 0 0 1 183.85,282.626" fill="none" stroke="#312e81" stroke-width="2"/><text x="172.857" y="266.221" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">a</text>
    <path d="M170.083,223.288 A26,26 0 0 1 209.917,223.288" fill="none" stroke="#312e81" stroke-width="2"/><text x="190" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">2a</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#312e81">Angles on the same arc are equal</text>
  </g>
  <g transform="translate(820,930)">
    <rect width="380" height="380" rx="16" fill="#fce7f3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Pi</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">The ratio of circumference to</tspan><tspan x="15" dy="16">diameter, the same for all circles.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d174d">π = C / d</text>
    <circle cx="190" cy="215" r="58" fill="#9d174d" fill-opacity="0.12" stroke="#9d174d" stroke-width="2.2"/>
    <path d="M132,215 L248,215" stroke="#64748b" stroke-width="1.6" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <text x="190" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">d</text>
    <text x="190" y="305" text-anchor="middle" font-size="26" font-weight="bold" fill="#9d174d">π ≈ 3.14159...</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#9d174d">An irrational, never repeating number</text>
  </g>
</svg>
