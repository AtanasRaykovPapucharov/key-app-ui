<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Въведение в анализа: седем основни понятия</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Основни понятия за граници, производни и интеграли.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Граници</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Стойността, към която клони</tspan><tspan x="15" dy="16">функцията близо до точка.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">lim f(x) = L</text>
    <line x1="55" y1="300" x2="313" y2="300" stroke="#64748b" stroke-width="1.8"/><path d="M320,300 L313,296.15 L313,303.85 Z" fill="#64748b"/>
    <line x1="90" y1="325" x2="90" y2="167" stroke="#64748b" stroke-width="1.8"/><path d="M90,160 L86.15,167 L93.85,167 Z" fill="#64748b"/>
    <text x="316" y="291" text-anchor="middle" font-size="12" fill="#64748b">x</text>
    <text x="101" y="171" text-anchor="middle" font-size="12" fill="#64748b">y</text>
    <path d="M100,290 L140,255 L180,228 L220,210 L250,200 L275,195" stroke="#1e40af" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <line x1="90" y1="185" x2="310" y2="185" stroke="#1e40af" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="320" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">L</text>
    <line x1="198" y1="282" x2="251.135" y2="227.033" stroke="#64748b" stroke-width="1.6"/><path d="M256,222 L248.367,224.357 L253.903,229.709 Z" fill="#64748b"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">Графиката може да не достигне L</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Производни</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Правила, които дават скоростта</tspan><tspan x="15" dy="16">на изменение на функцията.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">(c)' = 0</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">(x^2)' = 2x</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">(x^3)' = 3x^2</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">Константата не се мени: производна 0</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Производна</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Наклонът на допирателната</tspan><tspan x="15" dy="16">в дадена точка от графиката.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">f'(x) = lim (f(x+h) - f(x)) / h</text>
    <line x1="55" y1="300" x2="313" y2="300" stroke="#64748b" stroke-width="1.8"/><path d="M320,300 L313,296.15 L313,303.85 Z" fill="#64748b"/>
    <line x1="80" y1="325" x2="80" y2="167" stroke="#64748b" stroke-width="1.8"/><path d="M80,160 L76.15,167 L83.85,167 Z" fill="#64748b"/>
    <text x="316" y="291" text-anchor="middle" font-size="12" fill="#64748b">x</text>
    <text x="91" y="171" text-anchor="middle" font-size="12" fill="#64748b">y</text>
    <path d="M94.8,144.24 L105.2,170.24 L115.6,194.16 L126,216 L136.4,235.76 L146.8,253.44 L157.2,269.04 L167.6,282.56 L178,294 L188.4,303.36 L198.8,310.64 L209.2,315.84 L219.6,318.96 L230,320 L240.4,318.96 L250.8,315.84 L261.2,310.64 L271.6,303.36" stroke="#166534" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <path d="M112,201 L196,327" stroke="#b45309" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
    <circle cx="152" cy="261" r="6" fill="#166534"/>
    <text x="160" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">f'(x)</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">По-стръмна допирателна: по-голяма стойност</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Интеграли</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Правила, които обръщат</tspan><tspan x="15" dy="16">действието диференциране.</tspan></text>
    <rect x="35" y="172" width="310" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.5"/>
    <text x="190" y="194.04" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">int 1 dx = x + C</text>
    <rect x="35" y="216" width="310" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.5"/>
    <text x="190" y="238.04" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">int x dx = x^2/2 + C</text>
    <rect x="35" y="260" width="310" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.5"/>
    <text x="190" y="282.04" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">int x^2 dx = x^3/3 + C</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">C се появява, защото (c)' = 0</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Интеграл</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Сбор от безкрайно много</tspan><tspan x="15" dy="16">тесни ивици под графиката.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#86198f">S = int f(x) dx</text>
    <line x1="55" y1="300" x2="313" y2="300" stroke="#64748b" stroke-width="1.8"/><path d="M320,300 L313,296.15 L313,303.85 Z" fill="#64748b"/>
    <line x1="80" y1="325" x2="80" y2="167" stroke="#64748b" stroke-width="1.8"/><path d="M80,160 L76.15,167 L83.85,167 Z" fill="#64748b"/>
    <text x="316" y="291" text-anchor="middle" font-size="12" fill="#64748b">x</text>
    <text x="91" y="171" text-anchor="middle" font-size="12" fill="#64748b">y</text>
    <path d="M120,300 L120,246 C160,214 200,202 260,196 L260,300 Z" fill="#86198f" fill-opacity="0.35" stroke="none"/>
    <path d="M95,268 L120,246 L160,222 L200,208 L260,196 L300,192" stroke="#86198f" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <text x="190" y="275" text-anchor="middle" font-size="20" font-weight="bold" fill="#86198f">S</text>
    <text x="120" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">a</text>
    <text x="260" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">b</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">a и b са границите на интегриране</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Скорост на изменение</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Колко бързо се променя една</tspan><tspan x="15" dy="16">величина спрямо друга.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">dy / dx</text>
    <line x1="55" y1="300" x2="313" y2="300" stroke="#64748b" stroke-width="1.8"/><path d="M320,300 L313,296.15 L313,303.85 Z" fill="#64748b"/>
    <line x1="80" y1="325" x2="80" y2="167" stroke="#64748b" stroke-width="1.8"/><path d="M80,160 L76.15,167 L83.85,167 Z" fill="#64748b"/>
    <text x="316" y="291" text-anchor="middle" font-size="12" fill="#64748b">x</text>
    <text x="91" y="171" text-anchor="middle" font-size="12" fill="#64748b">y</text>
    <path d="M105,272 L293,172" stroke="#c2410c" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <path d="M105,272 L293,272" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <path d="M293,272 L293,172" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round"/>
    <circle cx="105" cy="272" r="5" fill="#c2410c"/>
    <circle cx="293" cy="172" r="5" fill="#c2410c"/>
    <text x="199" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">dx</text>
    <text x="312" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">dy</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">Скоростта е път спрямо време</text>
  </g>
  <g transform="translate(20,930)">
    <rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Лице под графиката</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Тесни правоъгълници я приближават;</tspan><tspan x="15" dy="16">по-тесните дават по-точен резултат.</tspan></text>
    <line x1="55" y1="300" x2="313" y2="300" stroke="#64748b" stroke-width="1.8"/><path d="M320,300 L313,296.15 L313,303.85 Z" fill="#64748b"/>
    <line x1="80" y1="325" x2="80" y2="167" stroke="#64748b" stroke-width="1.8"/><path d="M80,160 L76.15,167 L83.85,167 Z" fill="#64748b"/>
    <text x="316" y="291" text-anchor="middle" font-size="12" fill="#64748b">x</text>
    <text x="91" y="171" text-anchor="middle" font-size="12" fill="#64748b">y</text>
    <rect x="120" y="246" width="34" height="54" fill="#047857" fill-opacity="0.3" stroke="#047857" stroke-width="1.2"/><rect x="155" y="222" width="34" height="78" fill="#047857" fill-opacity="0.3" stroke="#047857" stroke-width="1.2"/><rect x="190" y="208" width="34" height="92" fill="#047857" fill-opacity="0.3" stroke="#047857" stroke-width="1.2"/><rect x="225" y="196" width="34" height="104" fill="#047857" fill-opacity="0.3" stroke="#047857" stroke-width="1.2"/>
    <path d="M95,268 L120,246 L155,222 L190,208 L225,199 L262,193 L300,190" stroke="#047857" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#047857">Това е идеята на интеграла</text>
  </g>
</svg>
