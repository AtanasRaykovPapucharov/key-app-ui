<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Logic and Proofs: Eight Core Concepts</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Mathematical reasoning and proof techniques.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Statement</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A sentence that is either true</tspan><tspan x="15" dy="16">or false, never both.</tspan></text>
    <rect x="55" y="180" width="270" height="48" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#1e40af" stroke-width="1.6"/>
    <text x="165" y="212" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e40af">2 + 2 = 4</text>
    <path d="M272,200 l6.3,7.2 l13.5,-17.1" fill="none" stroke="#15803d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="248" width="270" height="48" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#1e40af" stroke-width="1.6"/>
    <text x="165" y="280" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e40af">2 + 2 = 5</text>
    <path d="M273,263 L291,281 M291,263 L273,281" stroke="#b91c1c" stroke-width="3.6" stroke-linecap="round"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">A question or a wish is not a statement</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Proof</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A chain of valid steps from</tspan><tspan x="15" dy="16">what is given to what is claimed.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Given</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Reasoning</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Conclusion</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">Every step must follow from the last</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Theorem</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">An important statement that</tspan><tspan x="15" dy="16">has been proved.</tspan></text>
    <path d="M120,300 L270,300 L120,190 Z" fill="#166534" fill-opacity="0.28" stroke="#166534" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M133,300 L133,287 L120,287" fill="none" stroke="#166534" stroke-width="2"/>
    <text x="190" y="160" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">a² + b² = c²</text>
    <text x="200" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">c</text>
    <text x="195" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">a</text>
    <text x="105" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">b</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">Pythagoras is the classic example</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Lemma</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A small proved result used as</tspan><tspan x="15" dy="16">a step towards a theorem.</tspan></text>
    <rect x="55" y="200" width="100" height="62" rx="10" fill="#854d0e" fill-opacity="0.45" stroke="#854d0e" stroke-width="2"/>
    <text x="105" y="240" text-anchor="middle" font-size="24" font-weight="bold" fill="#854d0e">L</text>
    <line x1="165" y1="231" x2="211" y2="231" stroke="#854d0e" stroke-width="2.4"/><path d="M218,231 L211,227.15 L211,234.85 Z" fill="#854d0e"/>
    <rect x="228" y="182" width="100" height="98" rx="10" fill="#854d0e" fill-opacity="0.2" stroke="#854d0e" stroke-width="2"/>
    <text x="278" y="242" text-anchor="middle" font-size="32" font-weight="bold" fill="#854d0e">T</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">A helper on the way to the main result</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Corollary</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A result that follows easily</tspan><tspan x="15" dy="16">from a theorem already proved.</tspan></text>
    <rect x="55" y="182" width="100" height="98" rx="10" fill="#86198f" fill-opacity="0.2" stroke="#86198f" stroke-width="2"/>
    <text x="105" y="242" text-anchor="middle" font-size="32" font-weight="bold" fill="#86198f">T</text>
    <line x1="165" y1="231" x2="211" y2="231" stroke="#86198f" stroke-width="2.4"/><path d="M218,231 L211,227.15 L211,234.85 Z" fill="#86198f"/>
    <rect x="228" y="200" width="100" height="62" rx="10" fill="#86198f" fill-opacity="0.45" stroke="#86198f" stroke-width="2"/>
    <text x="278" y="240" text-anchor="middle" font-size="24" font-weight="bold" fill="#86198f">C</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">Almost free once the theorem is done</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Direct Proof</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Start from the assumption and</tspan><tspan x="15" dy="16">reason straight to the result.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">n = 2k</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">n² = 4k²</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">n² = 2(2k²)</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">If n is even, then n² is even too</text>
  </g>
  <g transform="translate(20,930)">
    <rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Proof by Contradiction</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Assume the opposite and reach</tspan><tspan x="15" dy="16">an impossible conclusion.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#047857" stroke-width="1.5"/>
    <text x="190" y="194.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">√2 = p / q</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#047857" stroke-width="1.5"/>
    <text x="190" y="238.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">2q² = p²</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#047857" stroke-width="1.5"/>
    <text x="190" y="282.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">p = 2m,  q = 2n</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#047857">So p/q was never in lowest terms</text>
  </g>
  <g transform="translate(420,930)">
    <rect width="380" height="380" rx="16" fill="#e0e7ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Mathematical Induction</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Prove it for 1, then that each</tspan><tspan x="15" dy="16">case carries to the next.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#312e81" stroke-width="1.5"/>
    <text x="190" y="194.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">P(1)</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#312e81" stroke-width="1.5"/>
    <text x="190" y="238.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">P(k) → P(k + 1)</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#312e81" stroke-width="1.5"/>
    <text x="190" y="282.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">P(n),  n = 1, 2, 3, ...</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#312e81">Like dominoes: one falls, all fall</text>
  </g>
</svg>
