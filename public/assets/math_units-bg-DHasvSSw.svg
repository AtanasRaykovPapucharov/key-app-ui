<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Мерни единици: седем основни понятия</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Най-често използваните мерни единици.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Дължина</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Колко е дълго нещо.</tspan><tspan x="15" dy="16">Основна единица е метърът.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#1e40af" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1 km = 1000 m</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#1e40af" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1 m = 100 cm</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#1e40af" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">1 cm = 10 mm</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">Всяка стъпка е 10 или 1000 пъти</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Маса</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Колко вещество съдържа тялото.</tspan><tspan x="15" dy="16">Основна единица: килограм.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">1 t = 1000 kg</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">1 kg = 1000 g</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#991b1b" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">1 g = 1000 mg</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">Масата не е същото като тегло</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Време</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Измерва се в секунди,</tspan><tspan x="15" dy="16">минути и часове.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#166534" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">1 h = 60 min</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#166534" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">1 min = 60 s</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#166534" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">1 h = 3600 s</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">Времето се брои по 60, а не по 10</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Лице</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Измерва се в квадратни единици,</tspan><tspan x="15" dy="16">затова множителите се квадратират.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.5"/>
    <text x="190" y="194.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">1 m^2 = 10 000 cm^2</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.5"/>
    <text x="190" y="238.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">1 dm^2 = 100 cm^2</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.5"/>
    <text x="190" y="282.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">1 dka = 1000 m^2</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">10 пъти по-дълго: 100 пъти по-голямо лице</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Обем</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Измерва се в кубични</tspan><tspan x="15" dy="16">единици или в литри.</tspan></text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#86198f" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">1 l = 1000 ml</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#86198f" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">1 dm^3 = 1 l</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#86198f" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">1 m^3 = 1000 l</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">Един литър е един кубичен дециметър</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Скорост</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Изминат път, разделен</tspan><tspan x="15" dy="16">на времето.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">v = s / t</text>
    <rect x="55" y="194" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="216.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">36 km/h = 10 m/s</text>
    <rect x="55" y="238" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="260.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">1 m/s = 3,6 km/h</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">Дели km/h на 3,6, за да получиш m/s</text>
  </g>
  <g transform="translate(20,930)">
    <rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Температура</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Измерва се в градуси по</tspan><tspan x="15" dy="16">Целзий или в келвини.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">0°C = 273 K</text>
    <rect x="150" y="160" width="34" height="140" rx="17" fill="#ffffff" fill-opacity="0.8" stroke="#047857" stroke-width="2"/>
    <circle cx="167" cy="305" r="24" fill="#047857" fill-opacity="0.75" stroke="#047857" stroke-width="2"/>
    <rect x="158" y="230" width="18" height="78" fill="#047857" fill-opacity="0.75"/>
    <line x1="190" y1="175" x2="208" y2="175" stroke="#047857" stroke-width="2"/>
    <text x="248" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">100°C</text>
    <line x1="190" y1="285" x2="208" y2="285" stroke="#047857" stroke-width="2"/>
    <text x="238" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">0°C</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#047857">Водата замръзва при 0°C, кипи при 100°C</text>
  </g>
</svg>
