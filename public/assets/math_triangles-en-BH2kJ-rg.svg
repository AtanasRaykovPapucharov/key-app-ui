<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    rect[width="380"][height="380"] { fill-opacity: 0.82; }
  </style>
  <text x="610" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">Triangles: Nine Core Concepts</text>
  <text x="610" y="85" text-anchor="middle" font-size="15" font-style="italic" fill="#475569">Types and properties of triangles.</text>
  <g transform="translate(20,130)">
    <rect width="380" height="380" rx="16" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Equilateral Triangle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">All three sides equal and all</tspan><tspan x="15" dy="16">three angles 60°.</tspan></text>
    <path d="M110,300 L270,300 L190,161 Z" fill="#1e40af" fill-opacity="0.28" stroke="#1e40af" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="190" y1="295.5" x2="190" y2="304.5" stroke="#1e40af" stroke-width="2"/>
    <line x1="226.1" y1="232.745" x2="233.9" y2="228.255" stroke="#1e40af" stroke-width="2"/>
    <line x1="153.9" y1="232.745" x2="146.1" y2="228.255" stroke="#1e40af" stroke-width="2"/>
    <path d="M124.965,273.999 A30,30 0 0 1 140,300" fill="none" stroke="#1e40af" stroke-width="2"/><text x="146.359" y="282.975" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">60°</text>
    <path d="M240,300 A30,30 0 0 1 255.035,273.999" fill="none" stroke="#1e40af" stroke-width="2"/><text x="233.641" y="282.975" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">60°</text>
    <path d="M202.969,183.534 A26,26 0 0 1 177.031,183.534" fill="none" stroke="#1e40af" stroke-width="2"/><text x="190" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">60°</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#1e40af">It has three axes of symmetry</text>
  </g>
  <g transform="translate(420,130)">
    <rect width="380" height="380" rx="16" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Isosceles Triangle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Two sides equal, so the two</tspan><tspan x="15" dy="16">base angles are equal too.</tspan></text>
    <path d="M100,300 L280,300 L190,168 Z" fill="#991b1b" fill-opacity="0.28" stroke="#991b1b" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="139.31" y1="234.357" x2="146.746" y2="239.427" stroke="#991b1b" stroke-width="2"/><line x1="143.254" y1="228.573" x2="150.69" y2="233.643" stroke="#991b1b" stroke-width="2"/>
    <line x1="233.254" y1="239.427" x2="240.69" y2="234.357" stroke="#991b1b" stroke-width="2"/><line x1="229.31" y1="233.643" x2="236.746" y2="228.573" stroke="#991b1b" stroke-width="2"/>
    <path d="M118.027,273.561 A32,32 0 0 1 132,300" fill="none" stroke="#991b1b" stroke-width="2"/>
    <path d="M248,300 A32,32 0 0 1 261.973,273.561" fill="none" stroke="#991b1b" stroke-width="2"/>
    
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#991b1b">One axis of symmetry through the apex</text>
  </g>
  <g transform="translate(820,130)">
    <rect width="380" height="380" rx="16" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Scalene Triangle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">All three sides have different</tspan><tspan x="15" dy="16">lengths, all angles differ.</tspan></text>
    <path d="M70,300 L310,300 L235,172 Z" fill="#166534" fill-opacity="0.28" stroke="#166534" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="190" y1="295.5" x2="190" y2="304.5" stroke="#166534" stroke-width="2"/>
    <line x1="270.387" y1="241.295" x2="278.152" y2="236.745" stroke="#166534" stroke-width="2"/><line x1="266.848" y1="235.255" x2="274.613" y2="230.705" stroke="#166534" stroke-width="2"/>
    <line x1="160.789" y1="235.265" x2="155.273" y2="228.154" stroke="#166534" stroke-width="2"/><line x1="155.258" y1="239.556" x2="149.742" y2="232.444" stroke="#166534" stroke-width="2"/><line x1="149.727" y1="243.846" x2="144.211" y2="236.735" stroke="#166534" stroke-width="2"/>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#166534">No axis of symmetry at all</text>
  </g>
  <g transform="translate(20,530)">
    <rect width="380" height="380" rx="16" fill="#fef9c3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Right Triangle</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">One angle is exactly 90°.</tspan><tspan x="15" dy="16">Legs a, b and hypotenuse c.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">S = (a × b) ÷ 2</text>
    <path d="M100,300 L290,300 L100,170 Z" fill="#854d0e" fill-opacity="0.28" stroke="#854d0e" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M113,300 L113,287 L100,287" fill="none" stroke="#854d0e" stroke-width="2"/>
    <text x="195" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">a</text>
    <text x="85" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">b</text>
    <text x="208" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">c</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#854d0e">The hypotenuse is the longest side</text>
  </g>
  <g transform="translate(420,530)">
    <rect width="380" height="380" rx="16" fill="#fae8ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">Pythagorean Theorem</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">In a right triangle the squares</tspan><tspan x="15" dy="16">of the legs add to c squared.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#86198f">a² + b² = c²</text>
    <path d="M120,300 L270,300 L120,190 Z" fill="#86198f" fill-opacity="0.28" stroke="#86198f" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M133,300 L133,287 L120,287" fill="none" stroke="#86198f" stroke-width="2"/>
    <text x="195" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">4</text>
    <text x="105" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">3</text>
    <text x="210" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">5</text>
    <text x="190" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#86198f">9 + 16 = 25</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#86198f">3² + 4² = 5²</text>
  </g>
  <g transform="translate(820,530)">
    <rect width="380" height="380" rx="16" fill="#ffedd5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Triangle Inequality</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Any two sides together are</tspan><tspan x="15" dy="16">longer than the third one.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">a + b &gt; c</text>
    <rect x="55" y="172" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="194.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">2 + 3 > 4</text>
    <rect x="55" y="216" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="238.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">2 + 4 > 3</text>
    <rect x="55" y="260" width="270" height="34" rx="8" fill="#ffffff" fill-opacity="0.72" stroke="#c2410c" stroke-width="1.5"/>
    <text x="190" y="282.76" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">3 + 4 > 2</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#c2410c">Sides 2, 3, 4 do build a triangle</text>
  </g>
  <g transform="translate(20,930)">
    <rect width="380" height="380" rx="16" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Altitude</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A perpendicular from a vertex</tspan><tspan x="15" dy="16">to the opposite side.</tspan></text>
    <text x="190" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">S = (a × h) ÷ 2</text>
    <path d="M70,300 L310,300 L230,175 Z" fill="#047857" fill-opacity="0.28" stroke="#047857" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="230" y1="175" x2="230" y2="300" stroke="#047857" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M241,300 L241,289 L230,289" fill="none" stroke="#047857" stroke-width="2"/>
    <text x="244" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">h</text>
    <text x="150" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">a</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#047857">Every triangle has three altitudes</text>
  </g>
  <g transform="translate(420,930)">
    <rect width="380" height="380" rx="16" fill="#e0e7ff" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Median</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">Joins a vertex to the midpoint</tspan><tspan x="15" dy="16">of the opposite side.</tspan></text>
    <path d="M70,300 L310,300 L150,175 Z" fill="#312e81" fill-opacity="0.28" stroke="#312e81" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="150" y1="175" x2="190" y2="300" stroke="#312e81" stroke-width="2.2"/>
    <line x1="130" y1="295.5" x2="130" y2="304.5" stroke="#312e81" stroke-width="2"/>
    <line x1="250" y1="295.5" x2="250" y2="304.5" stroke="#312e81" stroke-width="2"/>
    <circle cx="190" cy="300" r="5" fill="#312e81"/>
    <text x="178" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">m</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#312e81">The three medians meet in one point</text>
  </g>
  <g transform="translate(820,930)">
    <rect width="380" height="380" rx="16" fill="#fce7f3" stroke="#475569" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Angle Bisector</text>
    <text x="15" y="52" font-size="12.5" fill="#334155"><tspan x="15" dy="0">A ray that cuts an angle into</tspan><tspan x="15" dy="16">two equal angles.</tspan></text>
    <path d="M70,300 L310,300 L190,172 Z" fill="#9d174d" fill-opacity="0.28" stroke="#9d174d" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="190" y1="172" x2="205" y2="300" stroke="#9d174d" stroke-width="2.2"/>
    <path d="M194.656,211.728 A40,40 0 0 1 162.642,201.181" fill="none" stroke="#9d174d" stroke-width="2"/>
    <path d="M225.565,209.936 A52,52 0 0 1 196.052,223.647" fill="none" stroke="#9d174d" stroke-width="2"/>
    <text x="215" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d174d">l</text>
    <text x="190" y="352" text-anchor="middle" font-size="11" fill="#9d174d">The three bisectors meet in one point</text>
  </g>
</svg>
